function calcBelgianHolidays(y){
  function easter(y){
    const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,
      f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,
      i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
      mo=Math.floor((h+l-7*m+114)/31),dy=((h+l-7*m+114)%31)+1;
    return new Date(y,mo-1,dy);
  }
  const E=easter(y),ep=n=>new Date(E.getTime()+n*864e5),asc=ep(39);
  const p=d=>d.toISOString().slice(0,10);
  return [
    {date:p(new Date(y,0,1)),label:'Nieuwjaar',type:'holiday'},
    {date:p(ep(-2)),label:'Goede vrijdag',type:'holiday'},
    {date:p(ep(1)),label:'Paasmaandag',type:'holiday'},
    {date:p(new Date(y,4,1)),label:'Dag v/d Arbeid',type:'holiday'},
    {date:p(asc),label:'O.H. Hemelvaart',type:'holiday'},
    {date:p(ep(50)),label:'Pinkstermaandag',type:'holiday'},
    {date:p(new Date(y,6,21)),label:'Nationale Feestdag',type:'holiday'},
    {date:p(new Date(y,7,15)),label:'O.L.V. Hemelvaart',type:'holiday'},
    {date:p(new Date(y,10,1)),label:'Allerheiligen',type:'holiday'},
    {date:p(new Date(y,10,11)),label:'Wapenstilstand',type:'holiday'},
    {date:p(new Date(y,11,25)),label:'Kerstmis',type:'holiday'},
    {date:p(new Date(y,0,2)),label:'Collectief',type:'collective'},
    {date:p(new Date(y,10,2)),label:'Allerzielen - coll.',type:'collective'},
    {date:p(new Date(y,11,24)),label:'Collectief',type:'collective'},
    {date:p(new Date(y,11,28)),label:'Collectief',type:'collective'},
    {date:p(new Date(y,11,29)),label:'Collectief',type:'collective'},
    {date:p(new Date(y,11,30)),label:'Collectief',type:'collective'},
    {date:p(new Date(y,11,31)),label:'Collectief',type:'collective'},
  ];
}
function ensureYearSpecials(y){
  if(!Object.keys(S.specials).some(d=>d.startsWith(String(y)))){
    calcBelgianHolidays(y).forEach(h=>{S.specials[h.date]={type:h.type,label:h.label};});

  }
}

async function loadFromDatabase() {
  try {
    const { data, error } = await _supabase
      .from('rooster_data')
      .select('status')
      .eq('sleutel', SK)
      .maybeSingle();
    if (error) throw error;
    if (data && data.status) {
      S = Object.assign(defaultState(), typeof data.status === 'string' ? JSON.parse(data.status) : data.status);
    } else {
      S = defaultState();
    }
  } catch(e) {
    console.error(e);
    S = defaultState();
  }
  render();
}

async function save() {
  try {
    await _supabase.from('rooster_data').upsert({ sleutel: SK, status: S });
  } catch(e) {
    console.error("Fout bij opslaan in database:", e);
  }
}

function toDateStr(d){return d.toISOString().slice(0,10);}
function getDayType(dateStr){const d=new Date(dateStr),dow=d.getDay();if(dow===0||dow===6)return 'weekend';const sp=S.specials[dateStr];if(sp)return sp.type;return 'work';}
function getDayLabel(dateStr){return S.specials[dateStr]?S.specials[dateStr].label:'';}

const CODES=['AANW','AV','V','FV','Z','MU','REC','AAP','R1Q','R2Q','R3Q','R4Q'];
const CODE_INFO={
  AANW:{label:'Aanwezig',cls:'b-aanw',hasHours:false},
  AV:{label:'Arbeidsduurverm.',cls:'b-av',hasHours:false},
  V:{label:'Verlof (dag)',cls:'b-v',hasHours:false,needsRight:true},
  FV:{label:'Flexibel verlof',cls:'b-fv',hasHours:true,needsRight:true},
  Z:{label:'Ziekte',cls:'b-z',hasHours:true,timeMode:true},
  MU:{label:'Meeruren',cls:'b-mu',hasHours:true},
  REC:{label:'Recuperatie',cls:'b-rec',hasHours:true},
  AAP:{label:'AAP-uren',cls:'b-aap',hasHours:true,needsRight:true},

function quarter(dateStr){const m=new Date(dateStr).getMonth()+1;return m<=3?1:m<=6?2:m<=9?3:4;}

  document.querySelectorAll('.nav-tab').forEach(b=>b.classList.toggle('active',b.textContent===map[t]));

  const tabs={rooster:renderRooster,kalender:renderKalender,rechten:renderRechten,saldo:renderSaldo,planning:renderPlanning,medewerkers:renderMedewerkers,instellingen:renderInstellingen};

}
function daysInMonth(y,m){return new Date(y,m,0).getDate();}
function dowNum(y,m,d){return new Date(y,m-1,d).getDay();}
function initials(n){return n.split(' ').filter((_,i,a)=>i===0||i===a.length-1).map(p=>p[0]).join('').toUpperCase();}
function padZ(n){return String(n).padStart(2,'0');}
function ds(y,m,d){return `${y}-${padZ(m)}-${padZ(d)}`;}
function getRoosterCell(empId,dateStr){return(S.rooster[empId]||{})[dateStr]||null;}
function setRoosterCell(empId,dateStr,val){if(!S.rooster[empId])S.rooster[empId]={};S.rooster[empId][dateStr]=val;save();}
function getRechten(empId,year){return((S.rechten[empId]||{})[year])||{V:0,FV:0,AAP:0,R1Q:0,R2Q:0,R3Q:0,R4Q:0,MU:0};}
function setRechten(empId,year,obj){if(!S.rechten[empId])S.rechten[empId]={};S.rechten[empId][year]=obj;save();}
function usedHours(empId,code,year){
  let total=0;const emp=S.employees.find(e=>e.id===empId);const ad=emp?emp.ad:8.5;
  for(let m=1;m<=12;m++){for(let d=1;d<=daysInMonth(year,m);d++){
    const dateStr=ds(year,m,d);const cell=getRoosterCell(empId,dateStr);
    if(!cell||cell.code!==code) continue;
    if(code==='V'||code==='AV'||!CODE_INFO[code].hasHours) total+=ad;
    else if(cell.hours!==undefined) total+=parseFloat(cell.hours)||0;
    else total+=ad;
  }}return total;
}

const MONTHS=['Jan','Feb','Mrt','Apr','Mei','Jun','Jul','Aug','Sep','Okt','Nov','Dec'];
const MFULL=['Januari','Februari','Maart','April','Mei','Juni','Juli','Augustus','September','Oktober','November','December'];

function yearBar(showMonth){
  const y=S.activeYear;
  const maxY=Math.max(2030,y+2);
  const yrs=[];for(let yr=2026;yr<=maxY;yr++) yrs.push(yr);
  return `<div class="card no-print" style="padding:10px 16px">
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
      <span style="font-size:12px;color:#64748b;font-weight:500">Jaar:</span>
      ${yrs.map(yr=>`<button class="btn btn-sm ${yr===y?'btn-primary':''}" onclick="S.activeYear=${yr};ensureYearSpecials(${yr});render()">${yr}</button>`).join('')}
      ${showMonth?`<span style="margin-left:16px;font-size:12px;color:#64748b;font-weight:500">Maand:</span>
      ${MONTHS.map((mn,i)=>`<button class="btn btn-sm ${i+1===S.activeMonth?'btn-primary':''}" onclick="S.activeMonth=${i+1};render()">${mn}</button>`).join('')}`:''}
    </div>
  </div>`;
}

function mField(label,inputHtml){return `<div><label>${label}</label>${inputHtml}</div>`;}
function mSelect(id,opts,sel){return `<select id="${id}">${opts.map(([v,l])=>`<option value="${v}"${v===sel?' selected':''}>${l}</option>`).join('')}</selectStreaming>`;}
function mFooter(...btns){return `<div class="modal-footer">${btns.join('')}</div>`;}
function mBtn(label,onclick,cls=''){return `<button class="btn ${cls}" onclick="${onclick}">${label}</button>`;}

// ── KALENDER ──────────────────────────────────────────────────────────────
function renderKalender(){
  const y=S.activeYear,m=S.activeMonth,days=daysInMonth(y,m),firstDow=(dowNum(y,m,1)+6)%7;
  const calDays=Array.from({length:days},(_,i)=>{
    const d=i+1,dateStr=ds(y,m,d),dow2=dowNum(y,m,d),isWeekend=dow2===0||dow2===6;
    const type=getDayType(dateStr),label=getDayLabel(dateStr);
    let cls='cal-day';
    if(isWeekend) cls+=' weekend';
    else if(type==='holiday') cls+=' is-holiday';
    else if(type==='collective') cls+=' is-collective';
    if(dateStr===toDateStr(new Date())) cls+=' today';
    return `<div class="${cls}"${isWeekend?'':` onclick="openDayEditor('${dateStr}')"`}>
      <span class="cal-day-num">${d}</span>
      ${label?`<span class="cal-day-label">${label}</span>`:''}
    </div>`;
  }).join('');
  const allSpecials=Object.entries(S.specials).filter(([d])=>d.startsWith(String(y))).sort(([a],[b])=>a.localeCompare(b));
  const rows=allSpecials.length
    ?allSpecials.map(([d,sp])=>`<tr>
        <td style="font-weight:500">${d}</td>
        <td>${['Zo','Ma','Di','Wo','Do','Vr','Za'][new Date(d).getDay()]}</td>
        <td><span class="badge ${sp.type==='holiday'?'b-fee':'b-col'}">${sp.type==='holiday'?'Feestdag':'Collectief'}</span></td>
        <td>${sp.label||''}</td>
        <td><button class="btn btn-sm" onclick="openDayEditor('${d}')">Bewerken</button>
            <button class="btn btn-sm btn-danger" style="margin-left:4px" onclick="removeSpecial('${d}')">Wissen</button></td>
      </tr>`).join('')
    :`<tr><td colspan="5" style="color:#94a3b8">Geen sluitingsdagen voor ${y}</td></tr>`;
  return yearBar(true)+`
  <div class="card">
    <div class="card-header"><span class="card-title">${MFULL[m-1]} ${y}</span>
      <button class="btn btn-sm btn-primary" onclick="openDayEditorBlank()">+ Dag toevoegen</button></div>
    <div class="cal-grid">
      ${['Ma','Di','Wo','Do','Vr','Za','Zo'].map(d=>`<div class="cal-head">${d}</div>`).join('')}
      ${Array(firstDow).fill('<div></div>').join('')}${calDays}
    </div>
    <div style="margin-top:12px;display:flex;gap:16px;font-size:12px;color:#64748b">
      <span><span style="color:#dc2626">■</span> Feestdag</span>
      <span><span style="color:#d97706">■</span> Collectief verlof</span>
      <span>Klik op een werkdag om te bewerken</span>
    </div>
  </div>
  <div class="card"><div class="card-header"><span class="card-title">Sluitingsdagen ${y}</span></div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Datum</th><th>Dag</th><th>Type</th><th>Omschrijving</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>`;
}
function openDayEditor(dateStr){
  const sp=S.specials[dateStr];
  const d=new Date(dateStr);
  const dayName=['Zondag','Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Zaterdag'][d.getDay()];
  openModal(`<h2>${dayName}</h2><div class="modal-sub">${dateStr}</div>
    ${mField('Type',mSelect('sp-type',[['work','Gewone werkdag'],['holiday','Feestdag'],['collective','Collectief verlof']],sp?sp.type:'work'))}
    ${mField('Omschrijving',`<input id="sp-label" type="text" placeholder="bijv. Kerstmis..." value="${sp?sp.label:''}">`)}
    ${mFooter(mBtn('Opslaan',`saveSpecial('${dateStr}')` ,'btn-primary'),sp?mBtn('Wissen',`removeSpecial('${dateStr}')` ,'btn-danger'):'',mBtn('Annuleren','forceClose()'))}
  `);
}
function openDayEditorBlank(){
  openModal(`<h2>Dag toevoegen</h2><div class="modal-sub">Markeer een werkdag als feestdag of collectief verlof</div>
    ${mField('Datum',`<input id="sp-date" type="date" value="${S.activeYear}-01-01">`)}
    ${mField('Type',mSelect('sp-type',[['holiday','Feestdag'],['collective','Collectief verlof']],'holiday'))}
    ${mField('Omschrijving',`<input id="sp-label" type="text" placeholder="bijv. Brugdag...">`)}
    ${mFooter(mBtn('Toevoegen','saveSpecialFromBlank()','btn-primary'),mBtn('Annuleren','forceClose()'))}
  `);
}
function saveSpecial(dateStr){
  const type=document.getElementById('sp-type').value,label=document.getElementById('sp-label').value.trim();
  if(type==='work') delete S.specials[dateStr]; else S.specials[dateStr]={type,label:label||type};
  save();forceClose();
}
function saveSpecialFromBlank(){
  const dateStr=document.getElementById('sp-date').value,type=document.getElementById('sp-type').value,label=document.getElementById('sp-label').value.trim();
  if(!dateStr) return;
  const d=new Date(dateStr);
  if(d.getDay()===0||d.getDay()===6){alert('Weekenddagen kunnen niet als sluiting worden ingegeven.');return;}
  S.specials[dateStr]={type,label:label||type};save();forceClose();
}
function removeSpecial(dateStr){delete S.specials[dateStr];save();forceClose();}

// ── ROOSTER ───────────────────────────────────────────────────────────────
function renderRooster(){
  const y=S.activeYear,m=S.activeMonth,days=daysInMonth(y,m);
  let dayHeaders='';
  for(let d=1;d<=days;d++){
    const dateStr=ds(y,m,d),type=getDayType(dateStr);
    const dn=['Z','M','D','W','D','V','Z'][dowNum(y,m,d)];
    const bg=type==='holiday'?'#fef2f2':type==='collective'?'#fefce8':type==='weekend'?'#f8fafc':'';
    const col=type==='holiday'?'#dc2626':type==='collective'?'#92400e':type==='weekend'?'#cbd5e1':'#64748b';
    const lbl=getDayLabel(dateStr);
    dayHeaders+=`<th class="day-th" style="background:${bg};color:${col}" title="${lbl||dateStr}">${dn}<br>${d}${lbl?'<br><span style="font-size:7px">★</span>':''}</th>`;
  }
  const wl=S.employees.filter(e=>e.role==='werkleider'),md=S.employees.filter(e=>e.role!=='werkleider');
  function empRow(emp,isWL){
    let cells='';
    for(let d=1;d<=days;d++){
      const dateStr=ds(y,m,d),type=getDayType(dateStr);
      const cell=getRoosterCell(emp.id,dateStr),code=cell?cell.code:(type==='work'?'AANW':'');
      const ci=CODE_INFO[code]||{};
      const bg=type==='holiday'?'#fef2f2':type==='collective'?'#fefce8':type==='weekend'?'#f8fafc':'';
      cells+=`<td class="rooster-day" style="background:${bg}" onclick="openCellEditor(${emp.id},'${dateStr}')">
        ${code&&code!=='AANW'?`<span class="badge ${ci.cls||''}" style="font-size:9px;padding:1px 4px">${code}</span>`:(type==='work'?'<span style="font-size:10px;color:#d1d5db">✓</span>':'')}
        ${cell&&cell.hours!==undefined?`<span style="font-size:9px;display:block;color:#94a3b8">${cell.hours}</span>`:''}
      </td>`;
    }
    return `<tr><td class="sticky-col" style="min-width:165px;font-size:12px;font-weight:500;white-space:nowrap">${emp.naam}${isWL?'<span class="wl-label">WL</span>':''}</td>
      <td style="text-align:center;color:#94a3b8;font-size:11px">${emp.ad}</td>${cells}</tr>`;
  }
  let rows='';
  wl.forEach(e=>rows+=empRow(e,true));
  rows+=`<tr class="divider-row"><td colspan="${days+2}"></td></tr>`;
  md.forEach(e=>rows+=empRow(e,false));
  return yearBar(true)+`
  <div class="card" style="padding:0">
    <div style="padding:14px 18px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
      <span class="card-title">${MFULL[m-1]} ${y}</span>
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-size:11px;color:#94a3b8">Klik op een cel om te bewerken</span>
        <button class="btn btn-sm no-print" onclick="window.print()" style="background:#2563eb;color:#fff;border-color:#2563eb;display:flex;align-items:center;gap:5px">📥 Afdrukken / Printen</button>
      </div>
    </div>
    <div class="tbl-wrap"><table>
      <thead><tr><th class="sticky-col" style="min-width:165px">Medewerker</th><th style="text-align:center;min-width:42px">AD</th>${dayHeaders}</tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>
  <div class="card no-print" style="padding:10px 16px">
    <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center">
      <span style="font-size:11px;color:#94a3b8;font-weight:500">CODES:</span>
      ${CODES.map(c=>`<span class="badge ${(CODE_INFO[c]||{}).cls||''}">${c}</span>`).join('')}
    </div>
  </div>`;
}

function openCellEditor(empId,dateStr){
  const type=getDayType(dateStr);if(type==='weekend') return;
  const emp=S.employees.find(e=>e.id===empId);
  const cell=getRoosterCell(empId,dateStr)||{code:'AANW'};
  const y=new Date(dateStr).getFullYear(),r=getRechten(empId,y),q=quarter(dateStr),lbl=getDayLabel(dateStr);
  const codeBtns=CODES.map(code=>{
    const ci=CODE_INFO[code],sel=cell.code===code;
    const isRimpel=code.startsWith('R')&&code.endsWith('Q'),rq=isRimpel?parseInt(code[1]):0;
    const wrongQ=isRimpel&&rq!==q,right=r[code]||0,blocked=ci.needsRight&&right===0;
    const used=ci.needsRight?usedHours(empId,code,y):0,exceeded=ci.needsRight&&right>0&&used>=right;
    const disabled=wrongQ||blocked||exceeded;
    let reason='',dangerR=false;
    if(wrongQ) reason=`Alleen in K${q}`;
    else if(blocked){reason='Geen verlofrecht ingesteld';dangerR=true;}
    else if(exceeded){reason=`Saldo vol (${used.toFixed(1)}/${right}u)`;dangerR=true;}
    else if(ci.needsRight&&right>0) reason=`Nog ${(right-used).toFixed(1)}u`;
    return `<button class="code-btn${sel?' selected':''}${disabled?' blocked':''}${dangerR?' danger-reason':''}"
      ${disabled?'disabled':''}
      onclick="${disabled?'':'selectCode(\''+code+'\','+empId+',\''+dateStr+'\')'}">
      <div style="display:flex;align-items:center;gap:7px">
        <span class="badge ${ci.cls}">${code}</span>
        <span style="font-weight:600;font-size:12px">${ci.label}</span>
      </div>
      ${reason?`<span class="reason">${reason}</span>`:''}
    </button>`;
  }).join('');
  const dayLabelHtml=type!=='work'?`<span style="display:inline-block;margin-top:4px;padding:2px 9px;border-radius:5px;font-size:11px;font-weight:500;background:${type==='holiday'?'#fee2e2':'#fef9c3'};color:${type==='holiday'?'#991b1b':'#854d0e'}">${lbl||type}</span>`:'';
  openModal(`<h2>${emp.naam}</h2><div class="modal-sub">${dateStr} ${dayLabelHtml}</div>
    <div class="code-grid">${codeBtns}</div>
    <div id="extra-field"></div>
    ${mFooter(mBtn('Dag wissen',`clearCell(${empId},'${dateStr}')` ,'btn-danger'),mBtn('Sluiten','forceClose()'))}
  `);
  if(cell.code&&CODE_INFO[cell.code]&&CODE_INFO[cell.code].hasHours) showExtraField(cell.code,empId,dateStr,cell.hours);
}
function selectCode(code,empId,dateStr){
  const cell=getRoosterCell(empId,dateStr)||{};
  cell.code=code;delete cell.hours;setRoosterCell(empId,dateStr,cell);
  document.querySelectorAll('#modal .code-btn').forEach(b=>{const badge=b.querySelector('.badge');if(badge)b.classList.toggle('selected',badge.textContent.trim()===code);});
  if(CODE_INFO[code]&&CODE_INFO[code].hasHours) showExtraField(code,empId,dateStr,null);
  else{document.getElementById('extra-field').innerHTML='';render();}
}
function showExtraField(code,empId,dateStr,val){
  const isTime=CODE_INFO[code]&&CODE_INFO[code].timeMode;
  document.getElementById('extra-field').innerHTML=`<div class="extra-box">
    <label style="font-size:12px;font-weight:600;color:#374151;display:block;margin-bottom:6px">${isTime?'Vertrekuur (bijv. 10:30):':'Aantal uren:'}</label>
    <input id="extra-input" type="${isTime?'time':'number'}" step="${isTime?'1':'0.25'}" value="${val||''}" style="max-width:180px;padding:8px 12px;border:1.5px solid #d1d5db;border-radius:8px;background:#fff;color:#0f172a;font-size:13px;font-family:inherit"
      oninput="saveExtra(${empId},'${dateStr}',this.value)">
  </div>`;
}
function saveExtra(empId,dateStr,val){const cell=getRoosterCell(empId,dateStr)||{code:'Z'};cell.hours=val;setRoosterCell(empId,dateStr,cell);render();}
function clearCell(empId,dateStr){if(S.rooster[empId]) delete S.rooster[empId][dateStr];save();forceClose();}

// ── VERLOFRECHTEN ─────────────────────────────────────────────────────────
function renderRechten(){
  const y=S.activeYear;
  const fields=[{key:'V',label:'Verlof (u)'},{key:'FV',label:'Flex. (u)'},{key:'AAP',label:'AAP (u)'},{key:'R1Q',label:'K1 (u)'},{key:'R2Q',label:'K2 (u)'},{key:'R3Q',label:'K3 (u)'},{key:'R4Q',label:'K4 (u)'}];
  const wl=S.employees.filter(e=>e.role==='werkleider'),md=S.employees.filter(e=>e.role!=='werkleider');
  function empRow(emp,isWL){
    const r=getRechten(emp.id,y);
    return `<tr><td style="font-size:12px;font-weight:500;white-space:nowrap">${emp.naam}${isWL?'<span class="wl-label">WL</span>':''}</td>
      <td style="text-align:center;color:#94a3b8;font-size:11px">${emp.ad}</td>
      ${fields.map(f=>{
        const used=usedHours(emp.id,f.key,y),right=r[f.key]||0,over=right>0&&used>right;
        const pct=right>0?Math.min(100,Math.round(used/right*100)):0;
        return `<td style="padding:4px 7px">
          <input type="number" step="0.25" min="0" value="${right}"
            style="width:60px;padding:4px 7px;border:1.5px solid ${over?'#fca5a5':'#d1d5db'};border-radius:6px;background:#fff;color:#0f172a"
            onchange="updateRecht(${emp.id},${y},'${f.key}',this.value)">
          ${right>0?`<div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${over?'#dc2626':'#22c55e'}"></div></div>
          <span style="font-size:10px;color:${over?'#dc2626':'#94a3b8'}">${used.toFixed(1)}/${right}u</span>`:'<span style="font-size:10px;color:#cbd5e1">—</span>'}
        </td>`;
      }).join('')}
    </tr>`;
  }
  let rows='';
  wl.forEach(e=>rows+=empRow(e,true));
  rows+=`<tr><td colspan="${fields.length+2}" style="height:4px;background:#1e293b;padding:0;border:none"></td></tr>`;
  md.forEach(e=>rows+=empRow(e,false));
  
  return yearBar(false)+`
  <div class="card" style="padding:0">
    <div style="padding:14px 18px;border-bottom:1px solid #f1f5f9;"><span class="card-title">Verlofrechten in Uren (${y})</span></div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Medewerker</th><th style="text-align:center">AD</th>${fields.map(f=>`<th>${f.label}</th>`).join('')}</tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>`;
}
function updateRecht(empId,year,key,val){
  const r=getRechten(empId,year);r[key]=parseFloat(val)||0;
  setRechten(empId,year,r);render();
}

// ── SALDO MU ──────────────────────────────────────────────────────────────
function renderSaldo(){
  const y=S.activeYear;
  let rows='';
  S.employees.sort((a,b)=>a.naam.localeCompare(b.naam)).forEach(emp=>{
    const r=getRechten(emp.id,y);
    const startMU=r.MU||0;
    const opgebouwd=usedHours(emp.id,'MU',y);
    const opgenomen=usedHours(emp.id,'REC',y);
    const actueel=startMU+opgebouwd-opgenomen;
    rows+=`<tr>
      <td style="font-weight:500">${emp.naam}</td>
      <td><input type="number" step="0.25" value="${startMU}" style="width:70px;padding:4px 6px;border:1.5px solid #d1d5db;border-radius:6px" onchange="updateStartMU(${emp.id},${y},this.value)"> u</td>
      <td style="color:#166534;font-weight:600">+ ${opgebouwd.toFixed(1)} u</td>
      <td style="color:#dc2626;font-weight:600">- ${opgenomen.toFixed(1)} u</td>
      <td><span class="badge" style="background:${actueel>=0?'#dcfce7':'#fee2e2'};color:${actueel>=0?'#166534':'#991b1b'}">${actueel.toFixed(1)} u</span></td>
    </tr>`;
  });
  return yearBar(false)+`
  <div class="card" style="padding:0">
    <div style="padding:14px 18px;border-bottom:1px solid #f1f5f9;"><span class="card-title">Meeruren & Recuperatie Status (${y})</span></div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Medewerker</th><th>Overdracht vorig jaar (Start)</th><th>Opgebouwd (MU)</th><th>Opgenomen (REC)</th><th>Huidig Saldo</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>`;
}
function updateStartMU(empId,year,val){
  const r=getRechten(empId,year);r.MU=parseFloat(val)||0;
  setRechten(empId,year,r);render();
}

// ── PLANNING ──────────────────────────────────────────────────────────────
function renderPlanning(){
  const dStr=S.planDate;
  const tType=getDayType(dStr);
  if(!S.planning[dStr]) S.planning[dStr]={};
  
  let taskCounts={};S.tasks.forEach(t=>taskCounts[t]=0);
  
  let peopleHtml='';
  S.employees.sort((a,b)=>a.naam.localeCompare(b.naam)).forEach(emp=>{
    const c=getRoosterCell(emp.id,dStr);
    const status=c?c.code:(tType==='work'?'AANW':'');
    const assignedTasks=S.planning[dStr][emp.id]||[];
    
    let stateLabel='';
    if(status && status!=='AANW'){
      stateLabel=`<span class="badge ${CODE_INFO[status].cls}" style="font-size:10px;margin-top:2px">${status}</span>`;
    }else if(tType==='work'){
      stateLabel=`<span class="badge b-aanw" style="font-size:10px;margin-top:2px">Beschikbaar</span>`;
    }else{
      stateLabel=`<span class="badge b-blocked" style="font-size:10px;margin-top:2px">Gesloten</span>`;
    }
    
    assignedTasks.forEach(t=>{if(taskCounts[t]!==undefined)taskCounts[t]++;});
    
    const chips=assignedTasks.map(t=>`<span class="task-chip" onclick="removeTaskFromEmp('${dStr}',${emp.id},'${t}')">${t} ✕</span>`).join(' ');
    
    peopleHtml+=`<div class="plan-person ${emp.role==='werkleider'?'is-wl':''}">
      <div class="plan-avatar ${emp.role==='werkleider'?'av-wl':'av-std'}">${initials(emp.naam)}</div>
      <div style="flex:1">
        <div style="font-weight:600;font-size:13px">${emp.naam}</div>
        <div>${stateLabel}</div>
        <div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:4px">${chips}
          <button class="add-task-btn" onclick="openAddTaskModal(${emp.id},'${dStr}')">+ Werf</button>
        </div>
      </div>
    </div>`;
  });
  
  let sidebarRows=S.tasks.map(t=>`<tr><td><strong>${t}</strong></td><td style="text-align:center"><span class="badge b-av">${taskCounts[t]}</span></td></tr>`).join('');
  
  return `<div class="card" style="padding:10px 16px">
    <div style="display:flex;align-items:center;gap:12px">
      <span style="font-size:13px;font-weight:600">Datum Selectie:</span>
      <input type="date" id="plan-date-input" class="btn btn-sm" value="${dStr}" onchange="S.planDate=this.value;render()">
    </div>
  </div>
  <div style="display:grid;grid-template-columns:3fr 1fr;gap:16px">
    <div class="card" style="padding:0"><div class="section-label">Personeelsbezetting & Werftoewijzing</div>${peopleHtml}</div>
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="card" style="padding:0">
        <div class="section-label">Aantallen per Werf</div>
        <table class="task-count-table"><thead><tr><th>Locatie/Werf</th><th style="text-align:center">Aantal</th></tr></thead><tbody>${sidebarRows}</tbody></table>
      </div>
    </div>
  </div>`;
}
function openAddTaskModal(empId,dateStr){
  const btns=S.tasks.map(t=>`<button class="btn btn-sm" style="text-align:left;display:block;width:100%;margin-bottom:4px" onclick="assignTaskToEmp('${dateStr}',${empId},'${t}')">${t}</button>`).join('');
  openModal(`<h2>Taak of Werf Toewijzen</h2><div class="modal-sub">Kies een locatie uit de lijst</div>
    <div style="max-height:260px;overflow-y:auto">${btns}</div>
    ${mFooter(mBtn('Sluiten','forceClose()'))}
  `);
}
function assignTaskToEmp(dateStr,empId,task){
  if(!S.planning[dateStr])S.planning[dateStr]={};
  if(!S.planning[dateStr][empId])S.planning[dateStr][empId]=[];
  if(!S.planning[dateStr][empId].includes(task)) S.planning[dateStr][empId].push(task);
  save();forceClose();
}
function removeTaskFromEmp(dateStr,empId,task){
  if(S.planning[dateStr] && S.planning[dateStr][empId]){
    S.planning[dateStr][empId]=S.planning[dateStr][empId].filter(t=>t!==task);
    save();render();
  }
}

// ── MEDEWERKERS ───────────────────────────────────────────────────────────
function renderMedewerkers(){
  let rows=S.employees.sort((a,b)=>a.naam.localeCompare(b.naam)).map(emp=>`<tr>
    <td><strong>${emp.naam}</strong></td>
    <td>${emp.role==='werkleider'?'Werkleider':'Medewerker'}</td>
    <td>${emp.ad} u</td>
    <td><button class="btn btn-sm btn-danger" onclick="verwijderMedewerker(${emp.id})">Wis</button></td>
  </tr>`).join('');
  return `<div class="grid" style="display:grid;grid-template-columns:1fr 2fr;gap:16px">
    <div class="card">
      <div class="card-header"><span class="card-title">Nieuwe Collega</span></div>
      ${mField('Volledige Naam',`<input type="text" id="add-emp-name" placeholder="Naam Familienaam">`)}
      ${mField('Rol',mSelect('add-emp-role',[['medewerker','Medewerker'],['werkleider','Werkleider']],'medewerker'))}
      ${mField('Arbeidsduur (uren per dag)',`<input type="number" id="add-emp-ad" step="0.25" value="8.5">`)}
      <div style="margin-top:14px"><button class="btn btn-primary" style="width:100%" onclick="saveNieuweMedewerker()">Toevoegen</button></div>
    </div>
    <div class="card" style="padding:0">
      <div class="card-header" style="padding:14px 18px;margin:0"><span class="card-title">Lijst van Medewerkers</span></div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Naam</th><th>Functie</th><th>Dagcontract</th><th>Actie</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </div>
  </div>`;
}
function saveNieuweMedewerker(){
  const nm=document.getElementById('add-emp-name').value.trim(),ro=document.getElementById('add-emp-role').value,ad=parseFloat(document.getElementById('add-emp-ad').value)||8.5;
  if(!nm)return;
  const id=S.employees.length?Math.max(...S.employees.map(e=>e.id))+1:1;
  S.employees.push({id,naam:nm,ad,role:ro});save();render();
}
function verwijderMedewerker(id){
  if(confirm("Medewerker definitief verwijderen?")){S.employees=S.employees.filter(e=>e.id!==id);save();render();}
}

// ── INSTELLINGEN / E-MAIL ──────────────────────────────────────────────────
function renderInstellingen(){
  return `<div class="card">
    <div class="card-header"><span class="card-title">E-mail Distributielijst</span></div>
    <p style="font-size:13px;color:#64748b;margin-bottom:12px;">Hier kun je e-mailadressen beheren van mensen die automatische updates moeten ontvangen.</p>
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <input type="text" id="new-email" class="form-control" placeholder="collega@bedrijf.be" style="flex:1;padding:6px 12px;border:1px solid #cbd5e1;border-radius:6px">
      <button class="btn btn-primary" onclick="voegEmailToe()">+ Voeg toe</button>
    </div>
    <div class="tbl-wrap">
      <table style="width:100%">
        <thead><tr><th>E-mailadres</th><th style="width:60px"></th></tr></thead>
        <tbody>
          ${S.emailOntvangers && S.emailOntvangers.length ? S.emailOntvangers.map((em,idx)=>`<tr><td>${em}</td><td><button class="btn btn-sm btn-danger" onclick="wisEmail(${idx})">Wis</button></td></tr>`).join('') : '<tr><td colspan="2" style="color:#94a3b8">Nog geen e-mailadressen geconfigureerd.</td></tr>'}
        </tbody>
      </table>
    </div>
  </div>`;
}
function voegEmailToe(){
  const input = document.getElementById('new-email');
  const em = input.value.trim();
  if(!em) return;
  if(!S.emailOntvangers) S.emailOntvangers = [];
  S.emailOntvangers.push(em);save();render();
}
function wisEmail(idx){
  S.emailOntvangers.splice(idx, 1);save();render();
}

// Start de applicatie op door direct de database uit te lezen
window.addEventListener('DOMContentLoaded', () => {
  loadFromDatabase();
});
</script>
</body>
</html>
